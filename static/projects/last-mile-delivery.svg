<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Last-mile delivery platform">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000a1f"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c7ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00c7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <g stroke="#192742" stroke-width="1">
    <path d="M0 187.5H1200M0 375H1200M0 562.5H1200M300 0V750M600 0V750M900 0V750"/>
  </g>
  <ellipse cx="600" cy="640" rx="360" ry="26" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- route with stops -->
  <path id="routePath" d="M180 560C260 470 330 430 430 450C530 470 540 560 640 560C740 560 760 430 860 400C940 376 1000 400 1040 430" fill="none" stroke="#00c7ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 26"/>
  <circle cx="180" cy="560" r="20" fill="#192742" stroke="#00c7ff" stroke-width="6"/>
  <circle cx="640" cy="560" r="20" fill="#192742" stroke="#00c7ff" stroke-width="6"/>
  <circle cx="1040" cy="430" r="26" fill="#00c7ff"/>
  <path d="M1032 424l6 6 12-14" stroke="#000a1f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulse ring at the finish marker -->
  <circle cx="1040" cy="430" r="26" fill="none" stroke="#00c7ff" stroke-width="4" opacity=".5">
    <animate attributeName="r" values="26;70" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- courier scooter driving along the route -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" calcMode="spline" keySplines="0.45 0 0.55 1" keyPoints="0;1" keyTimes="0;1" path="M180 560C260 470 330 430 430 450C530 470 540 560 640 560C740 560 760 430 860 400C940 376 1000 400 1040 430"/>
    <g transform="translate(-33 -32) scale(0.9)">
      <rect x="-10" y="-6" width="86" height="52" rx="10" fill="#0f2a4a" stroke="#00c7ff" stroke-width="5"/>
      <rect x="2" y="6" width="62" height="28" rx="6" fill="#00c7ff" opacity=".35"/>
      <circle cx="8" cy="66" r="18" fill="#000a1f" stroke="#00c7ff" stroke-width="6"/>
      <circle cx="74" cy="66" r="18" fill="#000a1f" stroke="#00c7ff" stroke-width="6"/>
      <rect x="30" y="-34" width="24" height="24" rx="6" fill="#00c7ff"/>
    </g>
  </g>
  <text x="600" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Last-mile Delivery Platform</text>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <rect x="256" y="692" width="160" height="44" rx="22" fill="#192742"/><text x="336" y="722" fill="#00c7ff">FastAPI</text>
    <rect x="436" y="692" width="126" height="44" rx="22" fill="#192742"/><text x="499" y="722" fill="#00c7ff">Flutter</text>
    <rect x="582" y="692" width="112" height="44" rx="22" fill="#192742"/><text x="638" y="722" fill="#00c7ff">React</text>
    <rect x="714" y="692" width="150" height="44" rx="22" fill="#192742"/><text x="789" y="722" fill="#00c7ff">WebSocket</text>
    <rect x="884" y="692" width="126" height="44" rx="22" fill="#192742"/><text x="947" y="722" fill="#00c7ff">PostGIS</text>
  </g>
</svg>
