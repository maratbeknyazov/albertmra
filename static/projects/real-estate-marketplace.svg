<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real Estate Marketplace MVP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000a1f"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c7ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00c7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#192742" stroke-width="1">
    <path d="M0 187.5H1200M0 375H1200M0 562.5H1200M300 0V750M600 0V750M900 0V750"/>
  </g>
  <!-- skyline -->
  <g fill="#0f2a4a">
    <rect x="120" y="380" width="120" height="260"/>
    <rect x="270" y="300" width="90" height="340"/>
    <rect x="390" y="430" width="130" height="210"/>
    <rect x="760" y="410" width="110" height="230"/>
    <rect x="900" y="340" width="90" height="300"/>
    <rect x="1020" y="450" width="110" height="190"/>
  </g>
  <g fill="#00c7ff">
    <rect x="140" y="410" width="18" height="24" opacity=".5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="180" y="410" width="18" height="24" opacity=".5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="140" y="460" width="18" height="24" opacity=".5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="180" y="520" width="18" height="24" opacity=".5"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="290" y="330" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="322" y="330" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="290" y="380" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.55;1;0.55" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="322" y="440" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.6s" begin="1.7s" repeatCount="indefinite"/></rect>
    <rect x="420" y="460" width="20" height="26" opacity=".5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="470" y="460" width="20" height="26" opacity=".5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.3s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="420" y="520" width="20" height="26" opacity=".5"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="920" y="370" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="952" y="370" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="920" y="420" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.1s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="952" y="480" width="16" height="22" opacity=".5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></rect>
  </g>
  <ellipse cx="600" cy="640" rx="360" ry="26" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- pulsing ring behind the pin -->
  <circle cx="600" cy="238" r="40" fill="none" stroke="#00c7ff" stroke-width="4" opacity=".5">
    <animate attributeName="r" values="40;95" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="238" r="40" fill="none" stroke="#00c7ff" stroke-width="4" opacity=".5">
    <animate attributeName="r" values="40;95" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <!-- bobbing location pin -->
  <g transform="translate(600 250)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -14; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" repeatCount="indefinite"/>
    <path d="M0 120C-52 66 -84 30 -84 -14 -84 -74 -42 -116 0 -116 42 -116 84 -74 84 -14 84 30 52 66 0 120Z" fill="#00c7ff"/>
    <circle cx="0" cy="-16" r="34" fill="#000a1f"/>
    <path d="M-8 -34h6v14h22v6h-28z" fill="#00c7ff"/>
  </g>
  <text x="600" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Real Estate Marketplace MVP</text>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <rect x="286" y="692" width="196" height="44" rx="22" fill="#192742"/><text x="384" y="722" fill="#00c7ff">Django REST</text>
    <rect x="502" y="692" width="130" height="44" rx="22" fill="#192742"/><text x="567" y="722" fill="#00c7ff">PostGIS</text>
    <rect x="652" y="692" width="118" height="44" rx="22" fill="#192742"/><text x="711" y="722" fill="#00c7ff">Expo</text>
    <rect x="790" y="692" width="122" height="44" rx="22" fill="#192742"/><text x="851" y="722" fill="#00c7ff">Docker</text>
  </g>
</svg>
